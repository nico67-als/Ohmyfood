<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OhMyFood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
        integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="scss/main.css">
</head>
<body>
    <header>
        <div class="header_a">
            <img src="assets/images/logo/ohmyfood.png" alt="logo ohmyfood"   class="header_a--logo">
        </div>
        <div class="header_b">
            <i class="fa-solid fa-location-dot header_b--icon"></i>
            <h2 class="header_b--text"> Paris, Belleville</h2>
        </div>
    </header>
    <section class="hero">
        <div class="hero_content">
            <h1 class="hero_content--title">Réservez le menu qui vous convient</h1>
            <p class="hero_content--subtitle">Découvrez des restaurants d'exception, sélectionnés par nos soins.</p>      
            <button href="#" class="hero_content--btn">
                Explorer nos restaurants
            </button>
        </div>
    </section>
    <section class="fonctionnement">
        <h2 class="fonctionnement_title">Fonctionnement</h2>
        <div class="card_section">
            <div class="card_section--card">
                <span class="card_section--card--number">1</span>
                <i class="fa-solid fa-mobile-screen-button card_section--card--icon"></i>
                <span class="card_section--card--text">Choisissez un restaurant</span>
            </div>
             <div class="card_section--card">
                <span class="card_section--card--number">2</span>
                <i class="fa-solid fa-list card_section--card--icon"></i>
                <span class="card_section--card--text">Composez votre menu</span>
            </div>
            <div class="card_section--card">
                <span class="card_section--card--number">3</span>
                <i class="fa-solid fa-store card_section--card--icon"></i>
                <span class="card_section--card--text">Dégustez au restaurant</span>
            </div>
        </div>
    </section>
    <section class="restaurants">
        <h2 class="restaurants_title">Restaurants</h2>
        <div class="cards">
            <a href="#">
                <div class="cards_card">
                    <img class="cards_card--img" src="assets/images/restaurants/jay-wennington-N_Y88TWmGwA-unsplash.jpg" alt="Photographie d'un plat en sauce" >
                    <div class="cards_card--content">
                        <span>La palette du goût</span>
                        <p>Ménilmontant</p>
                    </div>    
                </div>
            </a>    
        </div>
    </section>
</body>
</html>
